<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>وت‌پلاس · نوبت‌ها</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="assets/styles.css"/>
<link rel="stylesheet" href="assets/appointments.css"/>
<link rel="stylesheet" href="assets/booking.css"/>
</head>
<body>
<div class="app">
  <div id="sidebar-slot"></div>
  <main class="main">
    <div id="topbar-slot"></div>
    <div class="page">

      <div class="page-header">
        <div>
          <div class="page-eyebrow">برنامه‌ریزی هوشمند</div>
          <h1 class="page-title">تقویم نوبت‌ها</h1>
          <p class="page-subtitle">برنامه پزشکان را ببینید، صف روزانه را مدیریت کنید و تاریخچه نوبت‌ها را مرور کنید.</p>
        </div>
        <div class="sc-actions">
          <button class="btn btn-outline" onclick="SCH.toast('خروجی تقویم آماده دانلود است.','download')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            خروجی
          </button>
          <button class="btn btn-primary" onclick="SCH.book()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            ثبت نوبت جدید
          </button>
        </div>
      </div>

      <!-- ── toolbar (unified .pagebar) ──────────────── -->
      <div class="pagebar sc-pagebar">
        <div class="pagebar-row">
          <!-- primary tabs -->
          <div class="pb-seg lg" id="scTabs" role="tablist">
            <button data-tab="cal" class="active" role="tab" aria-selected="true" aria-controls="scCalPanel" id="scTabCal" title="میان‌بر: ۱">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>تقویم</span>
            </button>
            <button data-tab="queue" role="tab" aria-selected="false" aria-controls="scQueuePanel" id="scTabQueue" title="میان‌بر: ۲">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13"/><path d="M3 12h13"/><path d="M3 18h9"/><circle cx="18" cy="16" r="4"/><path d="M22 10V6a2 2 0 0 0-2-2h-4"/></svg>
              <span>نوبت‌های پیش رو</span>
            </button>
            <button data-tab="hist" role="tab" aria-selected="false" aria-controls="scHistPanel" id="scTabHist" title="میان‌بر: ۳">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="12" r="9"/></svg>
              <span>تاریخچه</span>
            </button>
          </div>

          <!-- fluid search (stretches to fill the row, like the patients toolbar) -->
          <div class="pb-search sc-search" id="scSearchWrap">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <input id="scQ" type="text" placeholder="جستجوی بیمار، مالک یا پزشک…" autocomplete="off" oninput="SCH.search(this.value)"/>
            <button class="clear" onclick="SCH.clearSearch()" title="پاک کردن" aria-label="پاک کردن">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>

          <div class="pb-tools sc-tools-end">
            <div class="seg" id="scViewSeg">
              <button data-view="day">روز</button>
              <button data-view="week">هفته</button>
              <button data-view="month">ماه</button>
            </div>
          </div>
        </div>

        <!-- tier 2 · calendar date-nav (Today / prev-next / label) — calendar tab only -->
        <div class="pagebar-row tier2 sc-navrow" id="scCalChrome">
          <div class="sc-nav">
            <button class="sc-today" onclick="SCH.goToday()" title="بازگشت به امروز (T)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              امروز
            </button>
            <span class="sc-nav-sep"></span>
            <button class="icon-btn nav-btn" onclick="SCH.step(-1)" title="بازه قبلی" aria-label="بازه قبلی">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <button class="icon-btn nav-btn" onclick="SCH.step(1)" title="بازه بعدی" aria-label="بازه بعدی">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
          </div>
          <div class="sc-label" id="scLabel"></div>
        </div>

        <!-- tier 3 · filters — calendar tab only -->
        <div class="pagebar-row tier2 sc-filters" id="scFilterRow">
          <span class="sc-flabel">نوع نوبت</span>
          <div class="sc-fgroup" id="scTypes"></div>
          <span class="sc-div"></span>
          <span class="sc-flabel">پزشک</span>
          <div class="sc-fgroup" id="scDocs"></div>
          <span class="sc-div"></span>
          <button class="chip ghost" id="scHideCancel" onclick="SCH.toggleCancel()">پنهان‌کردن لغوشده‌ها</button>
        </div>
      </div>

      <!-- panels -->
      <div id="scCalPanel" role="tabpanel" aria-labelledby="scTabCal">
        <div class="sc-shell">
          <div id="scView"></div>
        </div>
      </div>
      <div id="scQueuePanel" role="tabpanel" aria-labelledby="scTabQueue" hidden></div>
      <div id="scHistPanel" role="tabpanel" aria-labelledby="scTabHist" hidden></div>

    </div>
  </main>
</div>

<!-- appointment detail drawer -->
<aside class="dtl" id="dtl"></aside>
<div class="panel-backdrop" id="dtlBackdrop" onclick="SCH.closeDetail()"></div>

<!-- booking sheet -->
<div class="bk-backdrop" id="bkWrap" data-bk-backdrop hidden>
  <div class="bk-modal" role="dialog" aria-modal="true" aria-labelledby="bkTitle">
    <header class="bk-head">
      <div class="icon-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="titles">
        <div class="eyebrow">برنامه‌ریزی مراجعه</div>
        <h3 id="bkTitle">ثبت نوبت جدید</h3>
      </div>
      <div class="bk-headmeta" id="bkHeadMeta"></div>
      <button class="icon-btn close" onclick="SCH.closeBook()" title="بستن (Esc)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="bk-grid">
      <div class="bk-main" id="bkBody"></div>
      <aside class="bk-side" id="bkSide"></aside>
    </div>
  </div>
</div>

<div id="notif-slot"></div>
<script src="assets/icons.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/appointments.js"></script>
<script src="assets/appointments-panel.js"></script>
<script>
  mountLayout({ active: 'appointments', title: 'تقویم نوبت‌ها', crumbs: ['مرکز فرمان', 'نوبت‌ها'] });
  SCH.render();
</script>
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%231f8b7d%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%229%22/%3E%3C/svg%3E"/>
<title>وت‌پلاس · ویزیت و پرونده</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="assets/styles.css"/>
<style>
  /* =========================================================
     visits.html — Phase 7: gate (doctor + entry-mode) + wizard shell
     ========================================================= */

  .vp-wrap { display: block; }

  /* ---------- Root gate layout ---------- */
  .gate {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 1080px) {
    .gate { grid-template-columns: 1fr; }
  }

  /* ---------- LEFT: doctor rail ---------- */
  .doc-rail {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    position: sticky; top: 84px;
    box-shadow: var(--shadow-card);
  }
  .doc-rail .rail-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px 12px;
    border-bottom: 1px dashed var(--line-2);
    margin-bottom: 10px;
  }
  .doc-rail .rail-head .ttl {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 14px; color: var(--ink);
    letter-spacing: -.2px;
  }
  .doc-rail .rail-head .ttl .n {
    display: grid; place-items: center;
    width: 26px; height: 26px; border-radius: 9px;
    background: var(--brand-600); color: #fff;
    font-size: 12px; font-weight: 800;
  }
  .doc-rail .rail-head .hint { font-size: 11px; color: var(--muted); font-weight: 700; }

  .doc-list { display: flex; flex-direction: column; gap: 8px; }
  .doc-card {
    position: relative;
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 12px; align-items: center;
    padding: 12px 14px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    transition: border-color .18s ease, box-shadow .22s ease, transform .12s ease, background .18s;
  }
  .doc-card:hover { border-color: var(--brand-400); background: #fbfefd; }
  .doc-card:active { transform: translateY(1px); }
  .doc-card.is-selected {
    border-color: var(--brand-600);
    background: linear-gradient(180deg, var(--brand-50) 0%, #fff 90%);
    box-shadow: 0 6px 20px rgba(13,148,136,.14);
  }
  .doc-card .av {
    width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 18px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.10);
    letter-spacing: -.5px;
  }
  .doc-card .meta { min-width: 0; }
  .doc-card .name { font-weight: 800; font-size: 14px; color: var(--ink); }
  .doc-card .spec { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .doc-card .metric {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 10px; border-radius: 10px;
    background: var(--brand-50);
    color: var(--brand-700);
    font-variant-numeric: tabular-nums;
    min-width: 56px;
  }
  .doc-card .metric .n { font-size: 15px; font-weight: 800; line-height: 1; }
  .doc-card .metric .l { font-size: 10px; font-weight: 700; opacity: .8; }
  .doc-card.is-selected .metric { background: #fff; color: var(--brand-700); box-shadow: inset 0 0 0 1px var(--brand-100); }

  .doc-card .check {
    position: absolute; top: -8px; inset-inline-end: -8px;
    width: 26px; height: 26px; border-radius: 999px;
    background: var(--brand-600); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(13,148,136,.35);
    opacity: 0; transform: scale(.5);
    transition: opacity .18s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  .doc-card .check svg { width: 14px; height: 14px; }
  .doc-card.is-selected .check { opacity: 1; transform: scale(1); }

  .doc-rail .rail-foot {
    margin-top: 12px; padding: 10px 12px;
    background: linear-gradient(180deg, var(--brand-50), #fff);
    border: 1px dashed var(--brand-100);
    border-radius: 12px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-2); font-weight: 700;
  }
  .doc-rail .rail-foot svg { width: 16px; height: 16px; color: var(--brand-600); flex: none; }

  /* ---------- RIGHT: workspace ---------- */
  .work {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    overflow: hidden;
    min-height: 560px;
  }

  /* Doctor lockup at top of workspace once selected */
  .doc-lockup {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line-2);
    background: linear-gradient(90deg, var(--brand-50) 0%, #fff 60%);
  }
  .doc-lockup .av {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center; color: #fff;
    font-weight: 800; font-size: 18px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.1);
  }
  .doc-lockup .txt { flex: 1; min-width: 0; }
  .doc-lockup .name { font-weight: 800; font-size: 16px; color: var(--ink); letter-spacing: -.3px; }
  .doc-lockup .spec { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .doc-lockup .status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--brand-100);
    color: var(--brand-700); font-size: 12px; font-weight: 800;
  }
  .doc-lockup .status .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--ok); box-shadow: 0 0 0 3px rgba(47,143,106,.15); }

  /* Empty state (no doctor picked yet) */
  .empty-state {
    padding: 64px 40px;
    text-align: center;
  }
  .empty-state .ill {
    width: 108px; height: 108px; border-radius: 32px;
    margin: 0 auto 20px;
    background: linear-gradient(160deg, var(--brand-50), #fff 70%);
    display: grid; place-items: center;
    color: var(--brand-600);
    box-shadow: inset 0 0 0 1px var(--brand-100), 0 8px 24px rgba(13,148,136,.08);
    position: relative;
  }
  .empty-state .ill svg { width: 52px; height: 52px; }
  .empty-state .ill::before {
    content: ''; position: absolute; inset: -12px;
    border-radius: 40px;
    border: 1.5px dashed var(--brand-100);
    opacity: .6;
  }
  .empty-state h3 { margin: 0 0 8px; font-size: 20px; font-weight: 800; letter-spacing: -.4px; color: var(--ink); }
  .empty-state p { margin: 0 auto; color: var(--muted); font-size: 13.5px; max-width: 420px; line-height: 1.7; }
  .empty-state .arrow-hint {
    margin-top: 22px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--brand-50); color: var(--brand-700);
    font-weight: 800; font-size: 12px;
  }
  .empty-state .arrow-hint svg { width: 16px; height: 16px; }

  /* ---------- Entry-mode split ---------- */
  .mode-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--line-2);
  }
  @media (max-width: 900px) { .mode-split { grid-template-columns: 1fr; } }

  .mode-tab {
    padding: 22px 24px;
    background: #fff;
    cursor: pointer;
    position: relative;
    transition: background .2s ease;
    border-bottom: 3px solid transparent;
  }
  .mode-split .mode-tab + .mode-tab { border-inline-start: 1px solid var(--line-2); }
  @media (max-width: 900px) {
    .mode-split .mode-tab + .mode-tab { border-inline-start: 0; border-top: 1px solid var(--line-2); }
  }
  .mode-tab:hover { background: #fbfdfc; }
  .mode-tab.is-active {
    background: linear-gradient(180deg, var(--brand-50) 0%, #fff 60%);
    border-bottom-color: var(--brand-600);
  }
  .mode-tab .row {
    display: flex; align-items: flex-start; gap: 14px;
  }
  .mode-tab .ic {
    width: 44px; height: 44px; border-radius: 13px;
    display: grid; place-items: center; flex: none;
    background: var(--brand-50); color: var(--brand-700);
    transition: background .2s, color .2s, transform .2s;
  }
  .mode-tab .ic svg { width: 22px; height: 22px; }
  .mode-tab.is-active .ic { background: var(--brand-600); color: #fff; transform: scale(1.04); }
  .mode-tab.new .ic { background: var(--lilac-bg); color: #7b5cc4; }
  .mode-tab.new.is-active .ic { background: #7b5cc4; color: #fff; }

  .mode-tab .head-txt { flex: 1; min-width: 0; }
  .mode-tab .head-txt .kicker { font-size: 11px; color: var(--muted); font-weight: 800; letter-spacing: .2px; }
  .mode-tab .head-txt h3 { margin: 4px 0 4px; font-size: 16px; font-weight: 800; color: var(--ink); letter-spacing: -.3px; }
  .mode-tab .head-txt p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.65; }

  .mode-tab .count {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px;
    padding: 4px 10px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line);
    font-size: 11.5px; font-weight: 800; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .mode-tab.is-active .count { background: #fff; border-color: var(--brand-100); color: var(--brand-700); }
  .mode-tab .count .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--brand-600); }
  .mode-tab.new .count .dot { background: #7b5cc4; }

  /* ---------- Mode-body area ---------- */
  .mode-body { padding: 20px 24px 24px; }
  .body-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .body-head .t { font-size: 15px; font-weight: 800; color: var(--ink); letter-spacing: -.2px; }
  .body-head .t small { color: var(--muted); font-weight: 700; margin-inline-start: 6px; }

  /* Search field */
  .field-search {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    min-width: 240px;
    transition: border-color .18s, box-shadow .18s;
  }
  .field-search:focus-within { border-color: var(--brand-400); box-shadow: 0 0 0 3px rgba(13,148,136,.10); }
  .field-search svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .field-search input {
    flex: 1; border: 0; outline: 0; background: transparent;
    font: inherit; color: var(--ink); font-size: 13px;
  }
  .field-search input::placeholder { color: var(--muted-2); }

  /* Filter chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line);
    font-size: 12px; font-weight: 700; color: var(--ink-2);
    cursor: pointer;
    transition: all .18s;
    user-select: none;
  }
  .chip:hover { border-color: var(--brand-300, var(--brand-400)); color: var(--ink); }
  .chip.is-active { background: var(--brand-600); border-color: var(--brand-600); color: #fff; }
  .chip .c { font-variant-numeric: tabular-nums; opacity: .8; font-size: 11px; }

  /* ---------- Appointment list ---------- */
  .appt-list { display: flex; flex-direction: column; gap: 8px; }
  .appt-row {
    display: grid;
    grid-template-columns: 72px 40px 1fr auto;
    gap: 14px; align-items: center;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: border-color .18s, background .18s, transform .12s, box-shadow .22s;
    cursor: pointer;
  }
  .appt-row:hover {
    border-color: var(--brand-400);
    background: linear-gradient(180deg, #fbfefd 0%, #fff 100%);
    box-shadow: 0 4px 14px rgba(13,148,136,.06);
  }
  .appt-row.urgent {
    border-color: rgba(208,70,58,.35);
    background: linear-gradient(180deg, #fef4f2 0%, #fff 100%);
  }
  .appt-row.urgent:hover { border-color: var(--danger); }
  .appt-row .time {
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 4px;
    background: var(--brand-50);
    color: var(--brand-700);
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .appt-row.urgent .time { background: var(--danger-bg); color: var(--danger); }
  .appt-row .time .h { font-size: 15px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; }
  .appt-row .time .dur { font-size: 10px; opacity: .85; font-weight: 700; margin-top: 2px; }

  .appt-row .avpet {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--lilac-bg); color: #7b5cc4;
  }
  .appt-row .avpet.dog { background: #dbeafe; color: #3057a6; }
  .appt-row .avpet.cat { background: var(--peach-bg); color: #d47a3f; }
  .appt-row .avpet.bird { background: #d9f4ea; color: #2a7f5f; }
  .appt-row .avpet.rabbit { background: #fde5f0; color: #b6448a; }
  .appt-row .avpet svg { width: 22px; height: 22px; }

  .appt-row .info { min-width: 0; }
  .appt-row .info .top { display: flex; align-items: center; gap: 8px; }
  .appt-row .info .name { font-weight: 800; font-size: 14.5px; color: var(--ink); letter-spacing: -.2px; }
  .appt-row .info .kind { font-size: 11.5px; color: var(--muted); font-weight: 700; }
  .appt-row .info .owner { font-size: 12px; color: var(--ink-2); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .appt-row .info .owner svg { width: 12px; height: 12px; color: var(--muted); }
  .appt-row .info .phone { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

  .appt-row .cta {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--brand-600); color: #fff;
    border: 0; cursor: pointer; font-weight: 800; font-size: 12.5px;
    transition: background .18s, transform .12s;
  }
  .appt-row .cta:hover { background: var(--brand-700); }
  .appt-row .cta:active { transform: translateY(1px); }
  .appt-row .cta svg { width: 14px; height: 14px; }
  .appt-row.urgent .cta { background: var(--danger); }
  .appt-row.urgent .cta:hover { background: #b23a2f; }

  .pill-tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 800;
    background: var(--brand-50); color: var(--brand-700);
  }
  .pill-tag.warn { background: var(--warn-bg); color: var(--warn); }
  .pill-tag.info { background: var(--info-bg); color: var(--info); }
  .pill-tag.danger { background: var(--danger-bg); color: var(--danger); }
  .pill-tag.lilac { background: var(--lilac-bg); color: #7b5cc4; }
  .pill-tag.ok { background: var(--ok-bg); color: var(--ok); }

  /* Empty list state */
  .list-empty {
    padding: 40px 20px; text-align: center;
    background: #fbfcfb; border: 1px dashed var(--line);
    border-radius: 14px;
  }
  .list-empty .em-ic {
    width: 64px; height: 64px; border-radius: 18px;
    margin: 0 auto 12px;
    background: #fff; color: var(--muted);
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .list-empty h4 { margin: 0 0 6px; font-size: 15px; font-weight: 800; color: var(--ink-2); }
  .list-empty p { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
  .list-empty .switch-cta {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--brand-600); color: #fff;
    border: 0; cursor: pointer; font-weight: 800; font-size: 12.5px;
    transition: background .18s;
  }
  .list-empty .switch-cta:hover { background: var(--brand-700); }
  .list-empty .switch-cta svg { width: 14px; height: 14px; }

  /* ---------- New-visit form ---------- */
  .newform { display: flex; flex-direction: column; gap: 16px; }
  .form-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .form-card .head-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .form-card .head-row .lbl {
    font-size: 12.5px; font-weight: 800; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .form-card .head-row .lbl .step-num {
    width: 22px; height: 22px; border-radius: 8px;
    background: var(--brand-50); color: var(--brand-700);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 800;
  }
  .form-card .head-row .hint { color: var(--muted); font-size: 11.5px; font-weight: 700; }

  .patient-search-wrap { position: relative; }
  .patient-search-wrap .field-search { width: 100%; }
  .patient-dropdown {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow-pop);
    max-height: 280px; overflow-y: auto;
    padding: 6px;
    display: none;
  }
  .patient-dropdown.open { display: block; }
  .patient-opt {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 10px; align-items: center;
    padding: 8px 10px; border-radius: 10px;
    cursor: pointer;
    transition: background .12s;
  }
  .patient-opt:hover { background: var(--brand-50); }
  .patient-opt .av {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--brand-50); color: var(--brand-700);
  }
  .patient-opt .av svg { width: 18px; height: 18px; }
  .patient-opt .name { font-weight: 800; font-size: 13px; color: var(--ink); }
  .patient-opt .meta { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-top: 1px; }
  .patient-opt .phone { font-size: 11.5px; color: var(--muted-2); font-variant-numeric: tabular-nums; font-weight: 700; }

  .newpatient-btn {
    padding: 10px 12px; margin-top: 6px;
    text-align: start;
    background: var(--brand-50); border: 1px dashed var(--brand-100);
    border-radius: 10px;
    display: flex; align-items: center; gap: 8px;
    color: var(--brand-700); font-weight: 800; font-size: 12.5px;
    cursor: pointer;
    transition: background .18s;
  }
  .newpatient-btn:hover { background: var(--brand-100); }
  .newpatient-btn svg { width: 14px; height: 14px; }

  /* Selected patient card */
  .patient-picked {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 12px; align-items: center;
    padding: 12px 14px;
    background: linear-gradient(180deg, var(--brand-50), #fff);
    border: 1.5px solid var(--brand-100);
    border-radius: 12px;
  }
  .patient-picked .av {
    width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center;
    background: #fff; color: var(--brand-700);
    box-shadow: inset 0 0 0 1px var(--brand-100);
  }
  .patient-picked .av.cat { color: #d47a3f; }
  .patient-picked .av.dog { color: #3057a6; }
  .patient-picked .av.bird { color: #2a7f5f; }
  .patient-picked .av.rabbit { color: #b6448a; }
  .patient-picked .av svg { width: 24px; height: 24px; }
  .patient-picked .m .name { font-weight: 800; font-size: 14.5px; color: var(--ink); }
  .patient-picked .m .sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .patient-picked .m .phone { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; margin-inline-start: 6px; }
  .patient-picked .change {
    background: transparent; border: 1px solid var(--brand-100);
    color: var(--brand-700); font: inherit; font-weight: 800; font-size: 12px;
    padding: 6px 10px; border-radius: 10px;
    cursor: pointer;
    transition: background .18s, border-color .18s;
  }
  .patient-picked .change:hover { background: #fff; border-color: var(--brand-400); }

  /* Field grid */
  .field-grid {
    display: grid; gap: 12px;
    grid-template-columns: 1fr 1fr;
  }
  @media (max-width: 620px) { .field-grid { grid-template-columns: 1fr; } }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld label { font-size: 11.5px; font-weight: 800; color: var(--ink-2); }
  .fld input, .fld select, .fld textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink);
    font: inherit;
    transition: border-color .18s, box-shadow .18s;
  }
  .fld input:focus, .fld select:focus, .fld textarea:focus {
    outline: 0; border-color: var(--brand-400);
    box-shadow: 0 0 0 3px rgba(13,148,136,.10);
  }
  .fld textarea { resize: vertical; min-height: 74px; }

  /* Type selector */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
